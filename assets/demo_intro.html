<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>__DEMO_TITLE__ · 履迹 LüJi</title>
<style>__DEMO_STYLE__
.demo-nav{display:flex;gap:9px;flex-wrap:wrap}.demo-nav a{padding:7px 13px;border-radius:12px;text-decoration:none}.demo-nav a[aria-current="page"]{background:#fff;color:#39416b;box-shadow:var(--shadow)}
.demo-banner{border-bottom:1px solid var(--line);padding:10px 0 15px;margin-bottom:22px;color:var(--muted);font-size:12px}
.demo-hero{max-width:720px;margin:16px 0 30px}.demo-hero h1{font-size:30px;max-width:22em}.demo-hero p{max-width:46em}.demo-ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.demo-flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.demo-scene{padding:22px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.scene-label{font-size:12px;color:var(--muted);margin-bottom:12px}.dialogue{display:grid;grid-template-columns:64px 1fr;gap:8px 15px}.speaker{font-size:12px;color:var(--muted);padding-top:2px}.dialogue p{margin-bottom:12px}.scene-result{margin:4px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:12px}
.demo-reading{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85}.demo-record-list{list-style:none;padding:0}.demo-record-list li{padding:12px 0;border-bottom:1px solid var(--line)}
.demo-summary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.demo-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.demo-card{padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.demo-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.demo-day{padding:12px 10px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.6)}.demo-day h3{font-size:12px}.demo-day article+article{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}.demo-day a{font-size:12px}.demo-source{margin-top:22px}.demo-source li{margin:7px 0}
@media(max-width:760px){.demo-flow{grid-template-columns:1fr}.demo-week{grid-template-columns:repeat(2,minmax(0,1fr))}.demo-facts{grid-template-columns:1fr}.demo-hero h1{font-size:25px}.dialogue{grid-template-columns:42px 1fr}.demo-scene{padding:18px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap app-shell">
<header class="top glass-topbar"><div><div class="brand-row"><span class="brand-name">履迹 LüJi</span><span class="brand-note">A little further.</span></div><p class="small muted">让每一段积累，都能接住下一次选择。</p></div>__DEMO_NAV__</header>
<p class="demo-banner">虚构只读演示 · 不连接模型或 Agent</p>
__DEMO_BODY__
<footer class="footer"><span>履迹 LüJi · 职业发展 Skill</span><span>先理解自己，再决定下一步。</span></footer>
</main>
</body>
</html>
