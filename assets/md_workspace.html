<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>履迹 · 职业工作区</title>
<style>
/* Luji frosted workspace. Original CSS, no fonts, images or runtime dependencies.
   Customize material, contrast and motion with these tokens. */
:root {
  --page: #eef0f5;
  --surface: rgba(255, 255, 255, .62);
  --ink: #273040;
  --muted: #657083;
  --line: rgba(108, 120, 149, .14);
  --accent: #646caa;
  --accent-soft: rgba(105, 115, 183, .10);
  --radius: 22px;
  --shadow: 0 8px 28px rgba(49, 61, 91, .045), inset 0 1px 0 rgba(255, 255, 255, .96);
  --ease: cubic-bezier(.2, .75, .25, 1);
  --spring: cubic-bezier(.22, 1, .36, 1);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink);
  background: var(--page);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 300px; min-height: 100vh; isolation: isolate; }
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 86% 0%, rgba(190, 199, 229, .56), transparent 48%),
    radial-gradient(ellipse at 3% 52%, rgba(209, 216, 232, .45), transparent 44%),
    linear-gradient(130deg, #f8f9fb 0%, #f0f2f7 48%, #edeff5 100%);
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(145deg, rgba(255, 255, 255, .3), transparent 55%, rgba(255, 255, 255, .35));
}
button, input, select, textarea { font: inherit; color: inherit; }
button, a, input, select, textarea { touch-action: manipulation; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; opacity: .48; }
button, .button {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid rgba(111, 125, 154, .15);
  border-radius: 12px;
  padding: 8px 13px;
  background: rgba(255, 255, 255, .62);
  box-shadow: 0 1px 2px rgba(49, 61, 91, .025), inset 0 1px 0 rgba(255, 255, 255, .96);
  text-decoration: none;
  color: var(--ink);
  transition: background 160ms var(--ease), border-color 160ms var(--ease), box-shadow 180ms var(--ease), transform 180ms var(--spring);
}
button:hover, .button:hover {
  background: rgba(255, 255, 255, .94);
  border-color: rgba(110, 122, 162, .27);
  box-shadow: 0 4px 13px rgba(49, 61, 91, .065), inset 0 1px 0 #fff;
}
button:active, .button:active { transform: scale(.975); box-shadow: inset 0 1px 3px rgba(49, 61, 91, .08); }
button[aria-pressed="true"] { color: #39416b; background: #fff; border-color: rgba(120, 130, 175, .22); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, summary:focus-visible {
  outline: 3px solid #7c87bb;
  outline-offset: 4px;
}
a { color: #53627f; text-underline-offset: 3px; text-decoration-color: rgba(83, 98, 127, .35); overflow-wrap: anywhere; }
a:hover { color: #3e4f7a; text-decoration-color: currentColor; }
svg { flex-shrink: 0; }
h1, h2, h3, p { margin: 0 0 12px; }
h1 { font-size: 27px; line-height: 1.35; letter-spacing: -.035em; font-weight: 620; }
h2 { font-size: 19px; line-height: 1.45; letter-spacing: -.015em; font-weight: 600; }
h3 { font-size: 14px; line-height: 1.6; font-weight: 600; }
small, .small { font-size: 12px; }
.muted { color: var(--muted); }
.eyebrow { font-family: Georgia, serif; font-style: italic; font-size: 17px; letter-spacing: -.015em; color: #778196; margin-bottom: 6px; }

/* A single translucent shell keeps the workspace calm instead of boxing every line. */
.wrap {
  width: calc(100% - 80px);
  max-width: 1160px;
  min-width: 0;
  margin: 40px auto;
  padding: 32px 36px 24px;
  border: 1px solid rgba(255, 255, 255, .93);
  border-radius: 30px;
  background: rgba(255, 255, 255, .64);
  box-shadow: 0 28px 85px -32px rgba(55, 67, 103, .19), 0 3px 10px rgba(70, 83, 120, .025), inset 0 1px 0 #fff;
  -webkit-backdrop-filter: blur(30px) saturate(1.15);
  backdrop-filter: blur(30px) saturate(1.15);
}
.app-shell { position: relative; }
.top { display: flex; justify-content: space-between; gap: 24px; align-items: center; margin-bottom: 25px; }
.top > div { min-width: 0; }
.top p { margin-bottom: 0; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.top-actions button { white-space: nowrap; font-size: 12px; }
#ask-agent, #copy-context {
  background: linear-gradient(155deg, #69749c, #535d83);
  border-color: rgba(78, 90, 128, .32);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 4px 14px rgba(69, 83, 133, .15);
  color: #fff;
}
#ask-agent:hover, #copy-context:hover { background: linear-gradient(155deg, #727da7, #5b668d); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 6px 18px rgba(69, 83, 133, .2); }
.brand-row { display: flex; align-items: center; gap: 11px; margin-bottom: 27px; min-width: 0; }
.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; background: linear-gradient(140deg, rgba(255, 255, 255, .95), rgba(227, 231, 242, .7)); border: 1px solid rgba(255, 255, 255, 1); color: #646f98; box-shadow: 0 3px 10px rgba(74, 88, 130, .07), inset 0 1px 0 #fff; }
.brand-mark svg { width: 21px; height: 21px; }
.brand-name { font-size: 15px; font-weight: 620; letter-spacing: .12em; }
.brand-note { font-size: 11px; color: #7a8395; letter-spacing: .08em; }
.glass-topbar { min-width: 0; }

/* The active glass capsule is moved by JS. All buttons remain native controls. */
.tabs {
  display: flex;
  position: relative;
  isolation: isolate;
  width: fit-content;
  max-width: 100%;
  gap: 2px;
  padding: 6px;
  margin: 0 0 30px;
  border: 1px solid rgba(255, 255, 255, .88);
  border-radius: 17px;
  background: rgba(217, 224, 238, .35);
  box-shadow: inset 0 1px 4px rgba(74, 87, 126, .025), 0 1px 0 rgba(255, 255, 255, .6);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button { position: relative; z-index: 1; flex-shrink: 0; min-height: 39px; border: 0; border-radius: 12px; padding: 8px 18px; background: transparent; box-shadow: none; font-size: 13px; color: #6c7587; white-space: nowrap; }
.tabs button:hover { background: rgba(255, 255, 255, .35); color: #35415c; }
.tabs button[aria-pressed="true"] { background: rgba(255, 255, 255, .94); color: #35415c; box-shadow: 0 2px 7px rgba(69, 83, 123, .085), 0 0 0 1px rgba(255, 255, 255, .7); }
.tabs:has(.tab-indicator) button[aria-pressed="true"] { background: transparent; box-shadow: none; }
.tab-indicator { position: absolute; z-index: 0; left: 6px; top: 6px; height: calc(100% - 12px); border-radius: 12px; background: rgba(255, 255, 255, .96); border: 1px solid rgba(255, 255, 255, .96); box-shadow: 0 2px 7px rgba(69, 83, 123, .085), 0 0 0 1px rgba(255, 255, 255, .6); pointer-events: none; transition: transform 330ms var(--spring), width 330ms var(--spring); }

.view-panel { min-width: 0; }
.section-head { display: flex; justify-content: space-between; gap: 18px; align-items: center; margin: 24px 0 18px; }
.section-head:first-child { margin-top: 0; }
.section-head > div { min-width: 0; }
.section-head h2 { margin-bottom: 4px; }
.section-head p { margin: 0; }
.section-head > button { font-size: 12px; }
.panel { min-width: 0; padding: 23px; background: var(--surface); border: 1px solid rgba(255, 255, 255, .9); border-radius: var(--radius); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.panel > h3 { font-size: 12px; color: #667187; margin-bottom: 17px; font-weight: 550; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; min-width: 0; }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.pill { display: inline-flex; align-items: center; font-size: 11px; line-height: 1.6; border: 1px solid rgba(108, 120, 149, .11); border-radius: 7px; padding: 2px 8px; color: #69758c; background: rgba(230, 234, 244, .4); white-space: nowrap; }
.attention { border: 1px solid rgba(142, 130, 104, .16); border-radius: 10px; padding: 9px 12px; background: rgba(248, 245, 238, .74); color: #74654c; font-size: 12px; margin: 12px 0; }
.empty { color: var(--muted); padding: 24px 0; line-height: 1.8; }
.item-title { font-weight: 600; font-size: 14px; margin-bottom: 7px; overflow-wrap: anywhere; }
.item-card { min-width: 0; padding: 17px 0; border-bottom: 1px solid var(--line); }
.item-card:last-child { border-bottom: 0; padding-bottom: 0; }
.item-card:first-child { padding-top: 0; }
.item-card p { margin-bottom: 7px; }
.source-row { font-size: 12px; margin-top: 13px; display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; min-width: 0; }
.source-row a { max-width: 100%; }
.source-row button { min-height: 34px; font-size: 12px; border-radius: 9px; padding: 5px 10px; }
.markdown { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.85; color: #566174; }
.markdown:empty { display: none; }
.reading-copy { color: #566174; overflow-wrap: anywhere; line-height: 1.8; }
.reading-copy h3 { margin-top: 22px; margin-bottom: 8px; }
.reading-copy p { margin: 0 0 14px; }
.preview { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* Filter controls: quiet defaults, clear selected values and soft opening surfaces. */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 17px 0 23px; position: relative; z-index: 5; min-width: 0; }
.toolbar label { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #69758a; min-width: 0; }
.toolbar input, .toolbar select { background: rgba(255, 255, 255, .7); border: 1px solid rgba(112, 124, 155, .14); border-radius: 12px; padding: 9px 11px; min-width: 0; max-width: 100%; min-height: 40px; color: var(--ink); }
.toolbar input[type="date"] { width: 153px; font-variant-numeric: tabular-nums; }
.periods { display: flex; gap: 2px; flex-wrap: nowrap; padding: 4px; background: rgba(221, 227, 240, .42); border: 1px solid rgba(255, 255, 255, .8); border-radius: 13px; }
.periods button { border: 0; border-radius: 9px; box-shadow: none; background: transparent; min-height: 32px; min-width: 38px; padding: 4px 12px; font-size: 12px; color: #717b8e; }
.periods button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 5px rgba(61, 75, 114, .07); color: #3c4865; }
#previous-period, #next-period { width: 38px; min-height: 38px; padding: 6px; }
#today, #clear-filters { color: #6b7590; font-size: 12px; }
.filter-select { display: inline-flex; align-items: center; position: relative; min-width: 0; max-width: 100%; }
.filter-select > label { margin-right: 8px; white-space: nowrap; }
.filter-select > select { position: absolute; width: 1px; height: 1px; opacity: 0; clip-path: inset(50%); pointer-events: none; }
.select-trigger { min-width: 116px; max-width: 240px; min-height: 42px; padding: 9px 13px; justify-content: space-between; border-radius: 12px; background: rgba(255, 255, 255, .66); font-size: 12px; }
.select-trigger > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.select-trigger svg { width: 14px; height: 14px; opacity: .6; transition: transform 220ms var(--spring); }
.filter-select[data-open="true"] { z-index: 12; }
.filter-select[data-open="true"] .select-trigger { border-color: rgba(112, 126, 181, .45); background: rgba(255, 255, 255, .94); box-shadow: 0 0 0 3px rgba(111, 125, 183, .07); }
.filter-select[data-open="true"] .select-trigger svg { transform: rotate(180deg); }
.select-menu { position: absolute; left: 0; top: calc(100% + 8px); z-index: 50; min-width: 100%; width: max-content; max-width: min(300px, calc(100vw - 48px)); max-height: 300px; padding: 6px; margin: 0; overflow-y: auto; overscroll-behavior: contain; border: 1px solid rgba(255, 255, 255, .94); border-radius: 16px; background: rgba(250, 251, 255, .94); box-shadow: 0 16px 38px -10px rgba(48, 61, 100, .2), inset 0 1px 0 #fff; -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px); }
.select-menu button, .select-menu [role="option"] { display: flex; width: 100%; justify-content: space-between; gap: 18px; min-height: 38px; padding: 8px 11px; border: 0; border-radius: 10px; background: transparent; box-shadow: none; text-align: left; font-size: 12px; }
.select-menu button:hover, .select-menu [role="option"]:focus-visible { background: rgba(102, 118, 180, .07); }
.select-menu [aria-selected="true"] { background: rgba(102, 118, 180, .10); color: #535f91; }
#roles-sort-chips, .stage-filter { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.sort-chip, .filter-chip { min-height: 34px; border-radius: 11px; padding: 6px 12px; font-size: 12px; color: #707b8f; background: rgba(255, 255, 255, .35); border-color: transparent; box-shadow: none; white-space: nowrap; }
.sort-chip:hover, .filter-chip:hover { border-color: rgba(115, 126, 160, .13); background: rgba(255, 255, 255, .75); box-shadow: 0 2px 9px rgba(70, 83, 124, .04); }
.sort-chip[aria-pressed="true"], .filter-chip[aria-pressed="true"] { background: rgba(255, 255, 255, .96); color: #4e5b87; border-color: rgba(112, 128, 180, .23); box-shadow: 0 2px 8px rgba(69, 83, 123, .055), inset 0 1px 0 #fff; }
.filter-summary, #filter-summary { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; color: #7a8395; font-size: 12px; margin: 18px 0 14px; min-height: 27px; }
.filter-summary .filter-clear { font-size: 11px; min-height: 28px; padding: 3px 9px; border-radius: 8px; color: #66749a; background: rgba(230, 234, 246, .55); border-color: rgba(120, 135, 180, .12); box-shadow: none; }

/* Direction cards retain one stable text size. Decoration never encodes a score. */
.role-track { display: flex; gap: 18px; overflow-x: auto; padding: 5px 2px 23px; scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: #c8cedf transparent; min-width: 0; }
.role-card { position: relative; display: block; width: 288px; flex: 0 0 288px; min-height: 320px; scroll-snap-align: start; border: 1px solid rgba(255, 255, 255, .96); border-radius: 25px; padding: 25px; text-align: left; white-space: normal; background: linear-gradient(152deg, rgba(255, 255, 255, .87), rgba(249, 250, 255, .55)); box-shadow: 0 9px 25px -13px rgba(60, 74, 118, .15), inset 0 1px 0 #fff; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.role-card:hover { border-color: rgba(147, 160, 203, .5); background: linear-gradient(152deg, rgba(255, 255, 255, .98), rgba(248, 250, 255, .7)); box-shadow: 0 16px 35px -16px rgba(64, 78, 124, .23), inset 0 1px 0 #fff; transform: translateY(-3px); }
.role-card:active { transform: translateY(-1px) scale(.99); }
.role-card h3 { font-size: 18px; line-height: 1.45; letter-spacing: -.025em; margin-bottom: 12px; max-width: 90%; }
.role-card .counts { margin: 23px 0 17px; line-height: 2; color: #5e6c83; }
.role-card p:last-child { margin: 0; }
.role-card > span:last-child { display: block; margin-top: 22px; color: #6d7996; }
.role-orbit { display: flex; align-items: center; justify-content: space-between; margin-bottom: 21px; min-height: 44px; color: #8d99bf; }
.role-orbit svg { width: 46px; height: 46px; stroke-width: 1.15; }
.role-rank { font-family: Georgia, serif; font-style: italic; font-size: 20px; color: #a5aec4; }
.role-progress { height: 4px; margin: 17px 0; overflow: hidden; border-radius: 4px; background: rgba(124, 141, 184, .12); }
.role-progress > span, .role-progress > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #a2afcf, #7d89b3); }

/* Calendar surfaces belong to the same material family rather than a separate table UI. */
.calendar-shell { max-width: 100%; overflow-x: auto; border-radius: 18px; margin: 18px 0; border: 1px solid rgba(143, 156, 184, .13); background: rgba(255, 255, 255, .28); scrollbar-width: thin; }
.calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin: 0; min-width: 0; }
.weekday, .day { min-width: 0; padding: 11px; border-right: 1px solid rgba(108, 120, 149, .1); border-bottom: 1px solid rgba(108, 120, 149, .1); }
.weekday:nth-child(7n), .day:nth-child(7n) { border-right: 0; }
.weekday { font-size: 11px; font-weight: 500; color: #7b8599; text-align: center; background: rgba(233, 237, 246, .33); padding: 11px; }
.day { min-height: 115px; background: rgba(255, 255, 255, .33); }
.day.outside { background: rgba(230, 235, 245, .2); color: #9099aa; }
.day.today { background: rgba(238, 241, 252, .7); box-shadow: inset 0 0 0 1px rgba(125, 141, 192, .39); }
.day-number { font-size: 11px; font-variant-numeric: tabular-nums; color: #727f96; margin-bottom: 8px; }
.calendar-action { display: block; width: 100%; border: 1px solid rgba(134, 149, 189, .10); border-radius: 8px; background: rgba(220, 227, 245, .5); margin: 5px 0; padding: 5px 7px; font-size: 11px; line-height: 1.6; text-align: left; overflow-wrap: anywhere; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6); }
.calendar-action:hover { background: rgba(219, 227, 249, .8); border-color: rgba(132, 149, 196, .22); }
.year-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 20px 0; }
.month-card { display: block; padding: 18px; border: 1px solid rgba(255, 255, 255, .92); border-radius: 16px; background: rgba(255, 255, 255, .49); box-shadow: var(--shadow); text-align: left; }
.month-card strong { display: block; margin-bottom: 6px; }

.pipeline { display: flex; overflow-x: auto; align-items: flex-start; gap: 18px; padding: 5px 2px 23px; min-width: 0; scrollbar-width: thin; scrollbar-color: #c8cedf transparent; }
.stage { flex: 0 0 265px; min-width: 0; background: rgba(226, 232, 245, .26); border: 1px solid rgba(255, 255, 255, .7); border-radius: 22px; padding: 16px; }
.stage h3 { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #6e7d96; padding: 2px 3px 5px; }
.stage h3 > span { display: inline-grid; place-items: center; min-width: 22px; min-height: 22px; padding: 1px 5px; background: rgba(255, 255, 255, .6); border-radius: 7px; font-size: 11px; }
.application-card { display: block; width: 100%; padding: 18px; text-align: left; margin: 10px 0 0; background: rgba(255, 255, 255, .74); border: 1px solid rgba(255, 255, 255, .96); border-radius: 15px; box-shadow: 0 3px 11px rgba(69, 83, 123, .035), inset 0 1px 0 #fff; white-space: normal; overflow-wrap: anywhere; }
.application-card:hover { background: rgba(255, 255, 255, .98); border-color: rgba(139, 155, 202, .35); box-shadow: 0 7px 19px rgba(69, 83, 123, .075); transform: translateY(-2px); }
.application-card p { margin: 7px 0; }
.application-card p:last-child { margin-bottom: 0; }
.application-card strong { font-weight: 600; }
.history { list-style: none; padding: 0; margin: 24px 0; }
.history li { border-left: 1px solid rgba(132, 146, 184, .28); padding: 0 0 23px 21px; position: relative; }
.history li::before { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #a9b5d3; border: 2px solid #f9faff; box-shadow: 0 0 0 1px rgba(146, 161, 202, .38); left: -5px; top: 7px; }
.history li:last-child { border-color: transparent; }
.history p { margin: 5px 0; }
.history time { font-size: 12px; font-variant-numeric: tabular-nums; color: #7d889e; }

/* Detail and Agent dialogs use the same frosted edge, opening motion supplied by JS. */
details { border-top: 1px solid var(--line); padding: 14px 0; }
summary { cursor: pointer; color: #6c7990; }
.facts { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 9px; font-size: 12px; margin: 18px 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
dialog { border: 1px solid rgba(255, 255, 255, .95); border-radius: 25px; max-width: 780px; width: calc(100% - 40px); max-height: min(86vh, 900px); padding: 0; background: rgba(248, 250, 255, .97); color: var(--ink); box-shadow: 0 38px 100px -20px rgba(40, 54, 92, .33), inset 0 1px 0 #fff; -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px); overscroll-behavior: contain; }
dialog::backdrop { background: rgba(58, 70, 103, .18); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); }
.dialog-head { position: sticky; top: 0; background: rgba(248, 250, 255, .94); border-bottom: 1px solid var(--line); padding: 20px 25px; display: flex; align-items: center; gap: 14px; justify-content: space-between; z-index: 2; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.dialog-head h2 { margin: 0; font-size: 18px; }
.dialog-head button { border-radius: 50%; width: 34px; height: 34px; min-height: 34px; padding: 0; font-size: 12px; }
.dialog-body { padding: 6px 27px 27px; }
.dialog-body section { margin: 22px 0 28px; }
.dialog-body textarea { display: block; width: 100%; min-height: 110px; padding: 13px 15px; border: 1px solid rgba(126, 143, 184, .21); border-radius: 14px; background: rgba(255, 255, 255, .72); resize: vertical; margin-top: 10px; box-shadow: inset 0 1px 4px rgba(63, 80, 125, .025); }
.dialog-body pre { white-space: pre-wrap; word-break: break-word; padding: 17px; background: rgba(228, 234, 247, .42); border: 1px solid rgba(133, 149, 190, .09); border-radius: 13px; font-size: 12px; line-height: 1.8; color: #67758d; }
.dialog-body .toolbar { margin-bottom: 0; }
#agent-dialog .dialog-body { padding-top: 23px; }

function bounds(){const d=parseDate(state.date),y=d.getUTCFullYear(),m=d.getUTCMonth();if(state.period==='daily')return [iso(d),iso(d)];if(state.period==='weekly'){const start=plus(d,-((d.getUTCDay()+6)%7));return [iso(start),iso(plus(start,6))]}if(state.period==='monthly')return [iso(new Date(Date.UTC(y,m,1,12))),iso(new Date(Date.UTC(y,m+1,0,12)))];return [`${y}-01-01`,`${y}-12-31`]}

function interviewDate(doc){const m=doc.metadata;return m.prepared_on||m.practiced_on||m.updated_on||''}
function interviewCards(documents){return documents.map(doc=>{const m=doc.metadata;const file=href(doc.path)?`<a href="${E(href(doc.path))}" title="${E(doc.path)}">源文件 ↗</a>`:sourceLink(doc.path);return `<article class="item-card"><div class="row between"><button data-doc="${E(doc.path)}">${E(m.title)}</button><span class="pill">${E(TYPE[m.type])}</span></div><p class="small muted">${E(interviewDate(doc)||'未记录日期')}${m.round_id?' · '+E(m.round_label||m.round_id):''}${m.interview_on?' · 面试 '+E(m.interview_on):''}</p>${freshness(doc)}<div class="source-row"><button class="small" data-request="${E(doc.path)}">请 Agent 调整此材料</button>${file}</div></article>`}).join('')}
function interviewSection(roleId,companyId=null,opportunityId=null){const common=interviewDocuments(roleId),scoped=companyId?interviewDocuments(roleId,companyId,opportunityId):[];return `<section class="interview-section" data-interview-role="${E(roleId)}"><div class="row between"><h3>面试准备</h3><button class="small" data-prepare-role="${E(roleId)}"${companyId?' data-prepare-company="'+E(companyId)+'" data-prepare-opportunity="'+E(opportunityId)+'"':''}>请 Agent 准备面试</button></div>${companyId?(scoped.length?interviewCards(scoped):'<p class="small muted">本机会尚无面试材料。</p>'):''}<details${companyId?'':' open'}><summary class="small">可复用的岗位材料 · ${common.length} 份</summary>${common.length?interviewCards(common):'<p class="small muted">尚无通用材料，可以先整理真实经历。</p>'}</details></section>`}
function prepareInterview(target){const roleId=target.dataset.prepareRole,companyId=target.dataset.prepareCompany,opportunityId=target.dataset.prepareOpportunity;const paths=DATA.documents.filter(d=>d.metadata.role_id===roleId&&(d.metadata.type==='goal'||(['jd','application'].includes(d.metadata.type)&&companyId&&d.metadata.company_id===companyId&&d.metadata.opportunity_id===opportunityId))).map(d=>d.path);request(paths,'请结合已选岗位的 JD、相关过往经历和当前真实学习成果，准备面试材料。范围：方向 '+roleId+(companyId?'；公司 '+companyId+'；机会 '+opportunityId:'；岗位通用材料')+'。先按需读取，区分事实、学习中和待核实；如需确定面试轮次请向我澄清。不要自动改投递阶段、创建日程或把练习当成能力证据。')}
function roleDetails(id){const role=DATA.roles.find(r=>r.id===id);if(!role)return;const files=role.documents.map(p=>DOCS.get(p)).filter(Boolean);const jds=files.filter(d=>d.metadata.type==='jd');const a=role.assessment;const criteria=a?.metadata.criteria||[];detail(role.goal.metadata.title,`<section><h3>方向与想法</h3>${body(role.goal)}${sourceRow(role.goal)}</section><section><h3>匹配依据</h3>${a?`<p class="small muted">评估于 ${E(a.metadata.evaluated_on)} · 资料已判断 ${role.known} / ${role.total}</p>${freshness(a)}${criteria.map(c=>`<article class="item-card"><div class="row between"><strong>${E(c.requirement)}</strong><span class="pill">${E({supported:'已支持',partial:'部分支持',gap:'明确差距',unknown:'尚未判断'}[c.status])}</span></div><p>${E(c.note)}</p>${c.evidence.length?'<div class="source-row">'+c.evidence.map(sourceLink).join(' ')+'</div>':''}</article>`).join('')}${body(a)}${sourceRow(a)}`:'<p class="muted">尚无判断。可先补充目标要求或相关经历。</p>'}</section><section><h3>公司与 JD 文件</h3>${jds.length?jds.map(doc=>`<article class="item-card"><div class="item-title">${E(doc.metadata.title.startsWith(doc.metadata.company_name)?doc.metadata.title:doc.metadata.company_name+' · '+doc.metadata.title)}</div><p class="small muted">收集于 ${E(doc.metadata.collected_on)} · ${E(doc.metadata.opportunity_id)}</p><div class="markdown preview">${E(doc.body)}</div><div class="source-row"><button data-doc="${E(doc.path)}">查看 JD</button>${sourceLink(doc.path)}</div></article>`).join(''):'<p class="muted">尚无公司或 JD，仍可继续探索这个方向。</p>'}</section>${interviewSection(id)}${resumeLinks(id)}<section><h3>相关文件</h3>${files.filter(d=>!['jd','assessment',...INTERVIEW_TYPES].includes(d.metadata.type)).map(doc=>`<p class="small">${E(TYPE[doc.metadata.type]||doc.metadata.type)} · <button data-doc="${E(doc.path)}">${E(doc.metadata.title)}</button> ${sourceLink(doc.path)}</p>`).join('')||'<p class="muted">尚无其他文件。</p>'}</section>`,[role.goal.path,...role.documents])}
const stageLabel=stage=>STAGES.find(s=>s[0]===stage)?.[1]||stage;
const opportunityTitle=metadata=>DATA.roles.find(role=>role.id===metadata.role_id)?.goal.metadata.title||metadata.title;
function optionList(values,selected,all){return `<option value="">${E(all)}</option>`+values.map(([value,label])=>`<option value="${E(value)}"${value===selected?' selected':''}>${E(label)}</option>`).join('')}
function applicationFilters(){const apps=DATA.documents.filter(d=>['application','jd'].includes(d.metadata.type)).map(d=>d.metadata);const roleIds=[...new Set([...DATA.roles.map(r=>r.id),...apps.map(m=>m.role_id)])];if(state.role&&!roleIds.includes(state.role))state.role='';const names=new Map(DATA.roles.map(r=>[r.id,r.goal.metadata.title]));$('application-role').innerHTML=optionList(roleIds.map(id=>[id,names.get(id)||id]),state.role,'全部方向');const scoped=apps.filter(m=>!state.role||m.role_id===state.role),companies=[...new Map(scoped.map(m=>[m.company_id,m.company_name])).entries()];if(state.company&&!companies.some(c=>c[0]===state.company))state.company='';$('application-company').innerHTML=optionList(companies,state.company,'全部公司');const opportunityApps=scoped.filter(m=>!state.company||m.company_id===state.company),opportunities=[...new Map(opportunityApps.map(m=>[m.opportunity_id,m.title])).entries()];if(state.opportunity&&!opportunities.some(o=>o[0]===state.opportunity))state.opportunity='';$('application-opportunity').innerHTML=optionList(opportunities,state.opportunity,'全部机会')}
function filteredApplications(includeStage=true){return DATA.applications.filter(d=>{const m=d.metadata;return (!state.role||m.role_id===state.role)&&(!state.company||m.company_id===state.company)&&(!state.opportunity||m.opportunity_id===state.opportunity)&&(!includeStage||!state.stage||m.stage===state.stage)})}
function applications(){
 applicationFilters();syncSelects();
 const available=filteredApplications(false),apps=filteredApplications();
 $('stage-filters').innerHTML=[['','全部阶段'],...STAGES].filter(([id])=>!id||id===state.stage||available.some(a=>a.metadata.stage===id)).map(([id,label])=>`<button class="filter-chip" data-stage="${id}" aria-pressed="${String(state.stage===id)}">${E(label)}<span class="chip-count">${id?available.filter(a=>a.metadata.stage===id).length:available.length}</span></button>`).join('');
 const isFiltered=state.role||state.company||state.opportunity||state.stage;
 $('filter-summary').innerHTML=`<span>${isFiltered?'筛选到':'当前共有'} <strong>${apps.length}</strong> 个机会</span>${isFiltered?'<button class="filter-clear" data-clear-filters>清除筛选 <span aria-hidden="true">×</span></button>':''}`;
 const html=apps.length?`<div class="pipeline">${STAGES.filter(([id])=>apps.some(a=>a.metadata.stage===id)).map(([id,label])=>{const stageApps=apps.filter(a=>a.metadata.stage===id);return `<section class="stage"><h3><span><i class="stage-dot" aria-hidden="true"></i>${E(label)}</span><span class="muted">${stageApps.length}</span></h3>${stageApps.map(doc=>`<button class="application-card" data-application="${E(doc.path)}" data-motion-key="application:${E(doc.path)}"><div class="row between"><strong>${E(doc.metadata.company_name)}</strong><span class="card-arrow" aria-hidden="true">↗</span></div><p>${E(opportunityTitle(doc.metadata))}</p><p class="small muted">下一步：${E(doc.metadata.next_action||'尚未记录')}</p><p class="small muted">更新于 ${E(doc.metadata.updated_on)}</p></button>`).join('')}</section>`}).join('')}</div>`:'<div class="empty"><span class="empty-mark" aria-hidden="true">◌</span><p>尚无符合筛选的投递记录。</p><p class="small muted">只有实际保存的节点才会出现在这里。</p></div>';
 replaceWithMotion($('applications-content'),html);saveState();
}

function eventResume(resume){const r=resume||{status:'not_recorded'};if(r.status==='not_recorded')return '<p class="small muted event-resume">本次使用的简历：未记录</p>';const label=r.artifact==='resume.pdf'?'PDF':'HTML';if(r.status==='verified'&&r.href){let safe=false;try{const url=new URL(r.href);safe=url.protocol==='file:'&&!url.host&&!url.username&&!url.password}catch{}if(safe)return `<p class="small event-resume">本次使用：<a href="${E(r.href)}">${E(label)} · ${E(r.version.split('/').pop())}</a></p>`}return `<p class="small attention event-resume">${E(r.message||'本次使用的简历需核对')}${r.version?' · '+E(r.version.split('/').pop()):''}</p>`}
function applicationDetails(path){const doc=DOCS.get(path);if(!doc)return;const m=doc.metadata,history=DATA.application_events?.[path]||(m.history||[]).map(h=>({...h,resume:{status:'not_recorded'}}));detail(m.company_name+' · '+opportunityTitle(m),`<p><span class="pill">${E(stageLabel(m.stage))}</span></p><p>下一步：${E(m.next_action||'尚未记录')}</p><p class="small muted">更新于 ${E(m.updated_on)}</p><details><summary class="small">已记录的历史 · ${history.length} 条</summary>${history.length?'<ol class="history">'+history.map(h=>`<li><time>${E(h.date)}</time><p><strong>${E(stageLabel(h.stage))}</strong></p><p>${E(h.note)}</p>${eventResume(h.resume)}</li>`).join('')+'</ol>':'<p class="muted">尚未记录历史；不补造此前节点。</p>'}${body(doc)}${sourceRow(doc)}</details>${interviewSection(m.role_id,m.company_id,m.opportunity_id)}${resumeLinks(m.role_id,m.company_id,m.opportunity_id)}<section><h3>本机会相关文件</h3>${DATA.documents.filter(d=>d.path!==path&&!INTERVIEW_TYPES.includes(d.metadata.type)&&d.metadata.role_id===m.role_id&&d.metadata.company_id===m.company_id&&d.metadata.opportunity_id===m.opportunity_id).map(d=>`<p class="small">${E(TYPE[d.metadata.type]||d.metadata.type)} · ${sourceLink(d.path)}</p>`).join('')||'<p class="muted">尚无其他文件。</p>'}</section>`,[path,...(m.sources||[])])}
function view(name){const previous=state.view;state.view=name;closeSelects();buttons('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));for(const key of ['overview','plan','roles','applications'])$('view-'+key).hidden=key!==name;if(name==='overview')overview();if(name==='plan')plan();if(name==='roles')roles();if(name==='applications')applications();if(previous!==name)animateElement($('view-'+name),[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{duration:220});moveTabIndicator();saveState();notify('')}

function requestPaths(){if(state.selected.length)return state.selected;if(state.view==='applications')return filteredApplications().map(d=>d.path);if(state.view==='plan'){const [start,end]=bounds();return DATA.actions.filter(d=>d.metadata.scheduled_for>=start&&d.metadata.scheduled_for<=end).map(d=>d.path)}return []}
function agentText(){const paths=requestPaths();return `请在本地履迹工作区 ${DATA.workspace_path} 处理以下请求。\n快照时间：${DATA.generated_at}；查看日期：${state.date}；视图：${state.view}${state.view==='plan'?' / '+state.period:''}。\n${state.view==='applications'?'当前筛选：方向 '+(state.role||'全部')+'；公司 '+(state.company||'全部')+'；机会 '+(state.opportunity||'全部')+'；阶段 '+(state.stage||'全部')+'。匹配 '+filteredApplications().length+' 个机会；不要扩大到未选范围。\n':''}${paths.length?'先只读这些实际文件：\n'+paths.map(p=>DATA.source_links[p]?.absolute_path||p).join('\n'):(state.view==='applications'?'当前筛选没有机会，不要自动改动其他记录；可协助我检查筛选条件。':'先读取工作区索引，按本轮需要选择最少资料。')}\n${$('agent-note').value.trim()||'请帮助我检查当前安排，提出可选择的调整。'}\n先重读来源并展示具体修改草稿与影响，取得我对这份草稿的确认后再保存 Markdown；随后重新生成快照。页面本身尚未保存任何修改。`}
function request(paths,note=''){state.selected=paths||[];$('agent-note').value=note;$('copy-status').textContent='';$('agent-context').textContent=agentText();openDialog($('agent-dialog'));$('agent-note').focus()}
document.addEventListener('click',event=>{const target=/** @type {HTMLElement} */(event.target).closest('button');if(!target)return;if(target.dataset.view){state.selected=[];view(target.dataset.view)}else if(target.dataset.jump){state.selected=[];view(target.dataset.jump)}else if(target.hasAttribute('data-sort')){$('role-sort').value=target.dataset.sort;$('role-sort').dispatchEvent(new Event('change',{bubbles:true}))}else if(target.hasAttribute('data-stage')){state.selected=[];state.stage=target.dataset.stage;applications();Array.from(buttons('[data-stage]')).find(button=>button.dataset.stage===state.stage)?.focus({preventScroll:true})}else if(target.hasAttribute('data-clear-filters')){clearFilters()}else if(target.dataset.prepareRole){prepareInterview(target)}else if(target.dataset.doc){docDetails(DOCS.get(target.dataset.doc))}else if(target.dataset.request){request([target.dataset.request])}else if(target.dataset.role){roleDetails(target.dataset.role)}else if(target.dataset.application){applicationDetails(target.dataset.application)}else if(target.dataset.period){state.period=target.dataset.period;plan();saveState()}else if(target.dataset.month){state.period='monthly';state.date=target.dataset.month;plan();saveState()}});
$('close-detail').addEventListener('click',()=>closeDialog($('detail')));$('close-agent').addEventListener('click',()=>closeDialog($('agent-dialog')));
$('ask-agent').addEventListener('click',()=>request($('detail').open?state.selected:[]));
$('agent-note').addEventListener('input',()=>{$('agent-context').textContent=agentText()});
$('copy-context').addEventListener('click',async()=>{try{if(!navigator.clipboard?.writeText)throw Error('clipboard unavailable');await navigator.clipboard.writeText(agentText());$('copy-status').textContent='已复制，请粘贴给当前 Agent。'}catch(_){const range=document.createRange();range.selectNodeContents($('agent-context'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);$('copy-status').textContent='当前宿主不允许自动复制，已选中上下文，请按系统复制快捷键。'}});
$('snapshot-info').addEventListener('click',()=>detail('快照信息',`<dl class="facts"><dt>工作区</dt><dd>${E(DATA.workspace_path)}</dd><dt>身份</dt><dd>${E(DATA.workspace_id)}</dd><dt>生成时间</dt><dd>${E(DATA.generated_at)}</dd><dt>查看基准</dt><dd>${E(DATA.as_of)}</dd><dt>资料数</dt><dd>${DATA.documents.length} 份 Markdown</dd></dl><p class="small muted">本页无法检测生成之后的外部修改。重新生成才能读取最新资料；生成失败会保留上一次成功快照。</p><h3>源文件与本次版本</h3>${DATA.documents.map(d=>`<details><summary>${E(d.metadata.title)} · ${E(TYPE[d.metadata.type]||d.metadata.type)}</summary>${sourceRow(d)}<p class="small muted">${E(d.revision)}</p>${freshness(d)}</details>`).join('')}`,[]));
$('plan-date').addEventListener('change',event=>{if(event.target.value){state.date=event.target.value;plan();saveState()}});
for(const [id,direction] of /** @type {[string,number][]} */([['previous-period',-1],['next-period',1]]))$(id).addEventListener('click',()=>{const d=parseDate(state.date);if(state.period==='daily')state.date=iso(plus(d,direction));if(state.period==='weekly')state.date=iso(plus(d,7*direction));if(state.period==='monthly')state.date=iso(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+direction,1,12)));if(state.period==='yearly')state.date=iso(new Date(Date.UTC(d.getUTCFullYear()+direction,0,1,12)));plan();saveState()});
$('today').addEventListener('click',()=>{state.date=DATA.as_of;plan();saveState()});
$('role-sort').addEventListener('change',event=>{state.sort=event.target.value;roles()});
for(const [id,key] of [['application-role','role'],['application-company','company'],['application-opportunity','opportunity']])$(id).addEventListener('change',event=>{state[key]=event.target.value;if(key==='role'){state.company='';state.opportunity=''}if(key==='company')state.opportunity='';applications();saveState()});
function clearFilters(){state.role='';state.company='';state.opportunity='';state.stage='';state.selected=[];applications();saveState();selectWidgets.get('application-role')?.trigger.focus()}
$('clear-filters').addEventListener('click',clearFilters);
$('snapshot-label').textContent=parseDate(DATA.as_of).toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long',timeZone:'UTC'})+' · 本地快照';$('snapshot-label').title='生成于 '+DATA.generated_at;
for(const [id,label] of [['application-role','方向'],['application-company','公司'],['application-opportunity','机会']])enhanceSelect(id,label);
$('role-sort').hidden=true;$('role-sort').closest('label').hidden=true;
function restoreFromHash(){const params=new URLSearchParams(location.hash.slice(1));for(const key of ['view','period','date','role','company','opportunity','sort','stage'])if(params.has(key))state[key]=params.get(key);if(!['overview','plan','roles','applications'].includes(state.view))state.view='overview';if(!['daily','weekly','monthly','yearly'].includes(state.period))state.period='daily';if(!['fit','information','priority'].includes(state.sort))state.sort='fit';if(!STAGES.some(s=>s[0]===state.stage))state.stage='';if(!/^\d{4}-\d{2}-\d{2}$/.test(state.date)||Number.isNaN(parseDate(state.date).valueOf())||iso(parseDate(state.date))!==state.date)state.date=DATA.as_of;state.selected=[];view(state.view)}
window.addEventListener('hashchange',restoreFromHash);window.addEventListener('popstate',restoreFromHash);
syncSelects();view(state.view);
})();
</script>
</body>
</html>
