<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' file: data:; frame-src 'self' file:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>履迹 · 简历样式</title>
<style>
:root{color-scheme:light;--ink:#24272a;--muted:#71767b;--line:#e2e4e5;--paper:#fff;--ground:#f5f6f6;--scale:.7}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit;text-underline-offset:4px}button:focus-visible,a:focus-visible{outline:2px solid #3b5669;outline-offset:4px}button:disabled{cursor:default}.shell{max-width:1320px;margin:auto;padding:32px 36px 64px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:30px}.brand{font-size:15px;font-weight:650;letter-spacing:.12em}.brand small{font-size:12px;font-weight:400;letter-spacing:0;color:var(--muted);margin-left:12px}.workbench{font-size:12px;color:var(--muted);text-decoration:none}.intro{display:flex;justify-content:space-between;gap:30px;align-items:flex-end;margin-bottom:22px}h1{margin:0;font-size:28px;line-height:1.3;letter-spacing:-.02em;font-weight:600}.intro p{margin:9px 0 0;color:var(--muted);font-size:13px}.badge{font-size:11px;color:#62686c;border:1px solid var(--line);border-radius:99px;padding:5px 11px;white-space:nowrap}.studio{display:grid;grid-template-columns:238px minmax(0,1fr);gap:22px;align-items:start}.controls{position:sticky;top:20px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.section-label{font-size:12px;font-weight:600;margin:0 0 12px}.choices{display:grid;gap:6px}.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);transition:background .16s,border-color .16s,transform .16s}.choice:hover{background:#f5f6f6}.choice:active{transform:scale(.98)}.choice[aria-selected=true]{border-color:#c9ced1;background:#f1f3f3}.number{font:11px/1.6 ui-monospace,SFMono-Regular,monospace;color:#90959a;padding-top:2px}.choice-title{display:block;font-size:13px;font-weight:600}.choice-description{display:block;font-size:11px;line-height:1.55;color:var(--muted);margin-top:3px}.divider{border-top:1px solid var(--line);margin:18px 0}.avatar-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.avatar-choice{border:1px solid var(--line);border-radius:10px;background:white;padding:6px 3px;color:var(--muted);font-size:10px;line-height:1.4;transition:border-color .16s,background .16s}.avatar-choice[aria-pressed=true]{border-color:#4c5961;background:#f3f5f5;color:var(--ink)}.avatar-choice img,.avatar-none{width:42px;height:42px;display:block;margin:0 auto 5px;border-radius:7px;object-fit:cover;object-position:center 32%}.avatar-none{display:grid;place-items:center;background:#f2f3f3;color:#94999c;font-size:20px}.hint{color:var(--muted);font-size:11px;line-height:1.7;margin:16px 0 0}.viewer{background:#e9ecec;border:1px solid #dce0e1;border-radius:18px;overflow:hidden;min-width:0}.viewer-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 18px;background:#fff;border-bottom:1px solid var(--line)}.viewer-title{font-size:13px;font-weight:600}.open-preview{font-size:12px;color:#5f6a71;text-decoration:none}.preview-space{padding:18px 10px;overflow:hidden}.paper-stage{width:calc(850px * var(--scale));height:calc(1290px * var(--scale));margin:auto;transition:opacity .18s}.paper-frame{width:850px;height:1290px;display:block;border:0;transform:scale(var(--scale));transform-origin:top left;background:#e9eaec}.selection{font-size:12px;color:#61696e;margin:14px 0 0}.references{margin-top:46px;border-top:1px solid var(--line);padding-top:30px}.references h2{font-size:18px;font-weight:600;margin:0 0 7px}.references-intro{font-size:12px;color:var(--muted);margin:0 0 18px;max-width:780px}.reference-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.reference-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.reference-card h3{font-size:13px;line-height:1.6;margin:0 0 9px;font-weight:600}.reference-card p{font-size:12px;color:var(--muted);margin:0 0 10px}.license{font-size:10px;border-radius:5px;padding:3px 6px;background:#f1f3f3;color:#62696d;display:inline-block;margin-bottom:12px;max-width:100%}.reference-links{display:flex;gap:13px;flex-wrap:wrap;font-size:11px}.restricted-note{font-size:10px!important;line-height:1.7;margin-top:10px!important}.footer{margin-top:28px;font-size:11px;color:#858b8f}.empty{padding:20px;color:var(--muted)}
@media(max-width:800px){.shell{padding:20px 16px 40px}.studio{grid-template-columns:minmax(0,1fr)}.controls{position:static}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.choice{padding:9px}.avatar-options{display:flex}.avatar-choice{width:74px}.controls .divider{margin:12px 0}.reference-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{align-items:start}h1{font-size:24px}.badge{display:none}.top{margin-bottom:24px}.brand small{display:none}.viewer-head{padding:12px}}
@media(max-width:480px){.reference-grid{grid-template-columns:minmax(0,1fr)}.number{display:none}.choice-description{font-size:10px}.viewer-title{font-size:12px}.open-preview{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div class="brand">履迹 <small>Résumé Studio</small></div><a id="workbench" class="workbench" href="#">查看职业工作台 ↗</a></header>
<section class="intro"><div><h1>选择简历样式</h1><p>同一份虚构经历，六种排版。头像可以替换，也可以不放。</p></div><span class="badge">虚构资料 · 仅供选样</span></section>
<div class="studio">
<aside class="controls" aria-label="样式与头像"><p class="section-label" id="avatar-label">示例头像</p><div id="avatar-list" class="avatar-options" role="group" aria-labelledby="avatar-label"></div><div class="divider"></div><p class="section-label">排版</p><div id="template-list" class="choices" role="tablist" aria-label="简历排版" aria-orientation="vertical"></div><p class="hint">头像均为 AI 生成的虚构形象，排版不区分性别。选好后直接告诉 Agent 样式名，正式简历再换成你的资料与照片。</p></aside>
<section class="viewer" id="preview-panel" role="tabpanel" tabindex="0"><div class="viewer-head"><span class="viewer-title" id="preview-title"></span><a id="open-preview" class="open-preview" target="_blank" rel="noopener noreferrer">打开预览 / 打印 ↗</a></div><div class="preview-space" id="preview-space"><div class="paper-stage"><iframe id="resume-preview" class="paper-frame" title="简历样式预览" sandbox="" loading="eager"></iframe></div></div></section>
</div>
<p class="selection" id="selection-status" role="status" aria-live="polite"></p>
<section class="references" aria-labelledby="references-title"><h2 id="references-title">GitHub 上的其他排版参考</h2><p class="references-intro">这里是外部项目参考，点击后联网查看。上方六版为履迹内置排版；下方样例没有复制进包，可将喜欢的风格交给 Agent 讨论。许可证以原项目为准。</p><div id="reference-list" class="reference-grid"></div></section>
<footer class="footer">选择样式不会修改职业资料或保存一份正式简历。经历、照片与来源核对完成后，再单独生成和审阅。</footer>
</main>
<script id="gallery-data" type="application/json">__GALLERY_DATA__</script>
<script>
'use strict';
(() => {
/** @type {any} */
const DATA=JSON.parse(document.getElementById('gallery-data').textContent);
const byId=id=>document.getElementById(id);
const templates=DATA.templates;
const avatars=DATA.avatars;
let selectedTemplate=DATA.default_template;
let selectedAvatar=DATA.default_avatar;
function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el}
function validExternal(url){try{const parsed=new URL(url);return parsed.protocol==='https:'?parsed.href:null}catch{return null}}
function external(label,url){const link=node('a','',label);const target=validExternal(url);if(target){link.href=target;link.target='_blank';link.rel='noopener noreferrer'}return link}
function readHash(){const p=new URLSearchParams(location.hash.slice(1));const t=p.get('template'),a=p.get('avatar');selectedTemplate=templates.some(x=>x.id===t)?t:DATA.default_template;selectedAvatar=avatars.some(x=>x.id===a)?a:DATA.default_avatar}
function updateHash(){const p=new URLSearchParams({template:selectedTemplate,avatar:selectedAvatar});try{history.replaceState(null,'','#'+p.toString())}catch{}}
function fit(){const width=byId('preview-space').clientWidth-20;const scale=Math.min(1,Math.max(.2,(width||650)/850));document.documentElement.style.setProperty('--scale',String(scale))}
function show(){const t=templates.find(x=>x.id===selectedTemplate),a=avatars.find(x=>x.id===selectedAvatar);for(const button of Array.from(document.querySelectorAll('[data-template]'))){const active=button.getAttribute('data-template')===selectedTemplate;button.setAttribute('aria-selected',String(active));button.setAttribute('tabindex',active?'0':'-1')}for(const button of Array.from(document.querySelectorAll('[data-avatar]')))button.setAttribute('aria-pressed',String(button.getAttribute('data-avatar')===selectedAvatar));byId('preview-panel').setAttribute('aria-labelledby','template-'+t.id);byId('preview-title').textContent=t.name+' · '+a.name;const file=t.variants[selectedAvatar];byId('resume-preview').setAttribute('src',t.embedded_variants?.[selectedAvatar]||file);byId('resume-preview').setAttribute('title',t.name+' · '+a.name+' · 虚构简历预览');byId('open-preview').setAttribute('href',file);byId('selection-status').textContent='当前样式：'+t.name+'（'+t.id+'） · '+a.name;fit()}
for(const [i,t] of templates.entries()){const button=node('button','choice');button.type='button';button.id='template-'+t.id;button.dataset.template=t.id;button.setAttribute('role','tab');button.setAttribute('aria-controls','preview-panel');button.append(node('span','number',String(i+1).padStart(2,'0')));const label=node('span');label.append(node('span','choice-title',t.name),node('span','choice-description',t.description));button.append(label);button.addEventListener('click',()=>{selectedTemplate=t.id;updateHash();show()});button.addEventListener('keydown',event=>{const keys=['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','End'];if(!keys.includes(event.key))return;event.preventDefault();const n=templates.length;const step=['ArrowUp','ArrowLeft'].includes(event.key)?-1:1;const j=event.key==='Home'?0:event.key==='End'?n-1:(i+step+n)%n;selectedTemplate=templates[j].id;updateHash();show();byId('template-'+selectedTemplate).focus()});byId('template-list').append(button)}
for(const a of avatars){const button=node('button','avatar-choice');button.type='button';button.dataset.avatar=a.id;button.setAttribute('aria-label',a.name);if(a.thumbnail){const img=node('img');img.src=a.thumbnail;img.alt=a.name+'，AI生成虚构形象';button.append(img)}else button.append(node('span','avatar-none','—'));button.append(node('span','',a.name));button.addEventListener('click',()=>{selectedAvatar=a.id;updateHash();show()});byId('avatar-list').append(button)}
for(const ref of DATA.references){const card=node('article','reference-card');card.append(node('span','license',ref.license),node('h3','',ref.title),node('p','',ref.usage));const links=node('div','reference-links');links.append(external('项目',ref.repo_url));if(ref.preview_url)links.append(external('官方样例',ref.preview_url));links.append(external('许可证',ref.license_url));card.append(links);if(ref.restricted)card.append(node('p','restricted-note','仅作外链风格参考；有非商业或再分发限制，不作为内置模板。'));byId('reference-list').append(card)}
byId('workbench').setAttribute('href',DATA.workbench_url);
window.addEventListener('hashchange',()=>{readHash();show()});
if(typeof ResizeObserver==='function')new ResizeObserver(fit).observe(byId('preview-space'));else window.addEventListener('resize',fit);
readHash();show();
})();
</script>
</body>
</html>
